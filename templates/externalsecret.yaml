{{- /*
externalSecret, off by default. One external-secrets.io/v1 ExternalSecret that writes the Secret
<externalSecret.name> (default: the fullname) from a secret store, typically a ClusterSecretStore over AWS
Secrets Manager. With remoteKey alone every top-level key of that JSON secret becomes a Secret key
(dataFrom extract); with keys only those keys are copied; data entries are added as written. The Secret
is passed with envFrom to the Deployment, the worker, CronJobs and (through a hook copy) the migration
Job, unless externalSecret.envFrom is false.
*/ -}}
{{- $es := .Values.externalSecret | default dict }}
{{- if $es.enabled }}
{{- $name := include "+( .AppName ).externalSecretName" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "+( .AppName ).labels" . | nindent 4 }}
  {{- with $es.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "+( .AppName ).externalSecretSpec" (dict "root" . "target" $name) | nindent 2 }}
{{- end }}
