{{- if .Values.migrations.enabled }}
{{- /*
Secrets for the Job: with migrations.secretEnv true (default: true when externalSecret is enabled, false
otherwise, which is how every chart before it behaved) the Job gets the app's envFrom secrets. The
ExternalSecret's Secret is not used directly: the Job runs before the release's normal resources, so on a
fresh install it would not exist yet. A hook copy, <fullname>-migration, is created first (weight 0,
Argo CD waits for it to be Healthy) and the Job reads that instead.
*/}}
{{- $es := .Values.externalSecret | default dict }}
{{- $useSecrets := hasKey .Values.migrations "secretEnv" | ternary .Values.migrations.secretEnv (and $es.enabled true) }}
{{- $esCopy := and $useSecrets $es.enabled (ne (toString $es.envFrom) "false") }}
{{- $migrationSecret := printf "%s-migration" (include "+( .AppName ).fullname" .) }}
{{- $secretNames := list }}
{{- if $useSecrets }}
{{- range (include "+( .AppName ).envFromSecrets" . | fromJsonArray) }}
{{- if and $esCopy (eq . (include "+( .AppName ).externalSecretName" $)) }}
{{- $secretNames = append $secretNames $migrationSecret }}
{{- else }}
{{- $secretNames = append $secretNames . }}
{{- end }}
{{- end }}
{{- end }}
{{- if $esCopy }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $migrationSecret }}
  labels:
    {{- include "+( .AppName ).labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- include "+( .AppName ).externalSecretSpec" (dict "root" . "target" $migrationSecret "hook" true) | nindent 2 }}
---
{{- end }}
{{- if .Values.configFiles.enabled }}
{{- /*
The migration Job runs before the release's normal resources (Helm pre-install/pre-upgrade,
Argo CD PreSync), so it cannot mount the app ConfigMap: on a fresh install that does not exist
yet, and on an upgrade it still holds the old config. This hook copy is created first (weight 0,
the Job is 5) with the same data.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "+( .AppName ).fullname" . }}-migration-config
  labels:
    {{- include "+( .AppName ).labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- include "+( .AppName ).configFilesData" . | nindent 2 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-migration"
  labels:
    {{- include "+( .AppName ).labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  template:
    metadata:
      name: "{{ .Release.Name }}-migration"
      labels:
        {{- include "+( .AppName ).joblabels" . | nindent 8 }}
      annotations:
        linkerd.io/inject: disabled
    spec:
      restartPolicy: Never
      containers:
      - name: pre-install-job
        {{- if .Values.migrations.image }}
        image: "{{ .Values.migrations.image }}"
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- end }}
        {{- if .Values.migrations.command }}
        command: {{ toYaml .Values.migrations.command | nindent 10 }}
        {{- end }}
        {{- if .Values.migrations.args }}
        args: {{ toYaml .Values.migrations.args | nindent 10 }}
        {{- end }}
        {{- if $secretNames }}
        envFrom:
        {{- range $secretNames }}
        - secretRef:
            name: {{ . | quote }}
        {{- end }}
        {{- end }}
        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}
        volumeMounts:
          {{- if .Values.configFiles.enabled }}
          - name: configfiles
            mountPath: {{ .Values.configFiles.mountPath }}
            readOnly: true
          {{- end }}
      volumes:
      {{- if .Values.configFiles.enabled }}
      - name: configfiles
        configMap:
          name: {{ include "+( .AppName ).fullname" . }}-migration-config
      {{- end }}
{{- end }}
