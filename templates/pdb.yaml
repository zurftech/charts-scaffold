{{- /*
podDisruptionBudget, off by default. Covers the app's Deployment (its selector labels, so with component
set the worker is not included). Neither minAvailable nor maxUnavailable set: maxUnavailable 1, which never
blocks a node drain (minAvailable 1 with one replica would).
*/ -}}
{{- $pdb := .Values.podDisruptionBudget | default dict }}
{{- if $pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "+( .AppName ).fullname" . }}
  labels:
    {{- include "+( .AppName ).labels" . | nindent 4 }}
spec:
  {{- if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ hasKey $pdb "maxUnavailable" | ternary $pdb.maxUnavailable 1 }}
  {{- end }}
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "+( .AppName ).selectorLabels" . | nindent 6 }}
{{- end }}
