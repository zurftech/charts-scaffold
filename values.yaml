# Default values for central-framework.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
image:
  repository: +( .ImageRepository )
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "v1"

entrypoint: {}
  # command: ["test2"]
  # args: ["test"]

# multiIngress:
#   - className: kong
#     annotations:
#       konghq.com/strip-path: "true"
#     # Optional, kong class only: one KongPlugin per key, named <fullname>-<index>-<key>,
#     # attached to this Ingress only. See README "multiIngress kongPlugins".
#     kongPlugins:
#       rate-limit:
#         plugin: rate-limiting
#         config:
#           minute: 5000      # per client IP; replaces the gateway's global limit here
#     hosts:
#       - host: app1.example.com
#         paths:
#           - path: /foo
#             pathType: Prefix

#   - className: nginx
#     annotations:
#       nginx.ingress.kubernetes.io/rewrite-target: /
#     hosts:
#       - host: app2.example.com
#         paths:
#           - path: /
#             pathType: Prefix


imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  annotations: {}
  # portName: test
  # port: 8080
  # appPort: 8000
  ports:
  - name: http
    port: 80
    appPort: 8050

# Restart other Deployments in this namespace after every successful sync. Argo CD runs it as a
# PostSync hook, after this app's resources are Healthy (new pods serving); plain Helm runs it as a
# post-install / post-upgrade hook. Use it for a client that reads this app only at startup, such as
# a GraphQL router that composes its supergraph by introspecting this app's subgraphs.
restartAfterSync:
  enabled: false
  # Deployment names in the release namespace, e.g. [apollo-router]
  deployments: []
  # Needs only the kubectl binary (it is the entrypoint); keep it within one minor of the cluster.
  image: registry.k8s.io/kubectl:v1.36.4
  # How long to wait for each restarted Deployment to finish rolling out. A timeout fails the sync.
  timeout: 5m
  resources: {}

migrations:
  enabled: false
  # image: otherimages
  # command: ["app"]
  args: ["migrate", "up"]
  # Pass the app's envFrom secrets (secretEnv, externalSecret) to the migration Job. Default: true when
  # externalSecret is enabled (the Job then reads a hook copy of it, <fullname>-migration), false otherwise.
  # secretEnv: true
  
#Ambassador gateway mappings
gateway:
  enabled: false
  websocket_enabled: false
  host: api.example.com
  timeout_ms: 0
  idle_timeout_ms: 0
  grpc: true
  ambassador_id: []
  routes: {}
  # routes:
  #  filter:
  #    ambassador_id: ["test2"]
  #    prefix: /route1/
  #    rewrite: /route1/
  #  stream:
  #    port:
  #    rewrite: /route2/
  #    prefix: /route2/

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

generatedEnvPrefix: ""
env: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

configFiles:
  enabled: false
  mountPath: /etc/app
  files: {}


livenessProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: liveness-port
  # failureThreshold: 1
  # periodSeconds: 10

startupProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: liveness-port
  # failureThreshold: 30
  # periodSeconds: 10

readinessProbe: {}
  # exec:
  #   command:
  #   - cat
  #   - /tmp/healthy
  # initialDelaySeconds: 5
  # periodSeconds: 5

persistence:
  enabled: false

# ---------------------------------------------------------------------------------------------------------
# Everything below is off or empty by default and renders nothing until set, so a chart that does not use
# it renders exactly as before. README.md has a section per feature.

# Secrets from a secret store (external-secrets.io/v1 ExternalSecret), passed to every app container with
# envFrom next to secretEnv. On euphoria: a ClusterSecretStore over AWS Secrets Manager, keys
# euphoria/<namespace>/<app>.
externalSecret:
  enabled: false
  # name: ""                          # ExternalSecret and Secret name; default <fullname>
  # storeName: aws-secretsmanager     # required
  # storeKind: ClusterSecretStore
  # remoteKey: euphoria/<namespace>/<app>   # JSON secret; alone: every top-level key becomes a Secret key
  # keys: []                          # with remoteKey: copy only these keys
  # data: []                          # extra entries as written, e.g. a key from another secret
  # refreshInterval: 1h
  # creationPolicy: Owner
  # deletionPolicy: ""                # e.g. Retain
  # envFrom: true                     # false: create the Secret, do not pass it as envFrom
  # annotations: {}

# app.kubernetes.io/component: <component> on the selector of the Deployment, Service and
# PodDisruptionBudget, and on every label set. Required by worker. Changing it on a live app changes the
# Deployment's selector, which Kubernetes does not allow in place.
component: ""

# A second Deployment for single-writer background work; see templates/worker.yaml for every override.
worker:
  enabled: false
  # name: worker                      # Deployment <fullname>-<name>, pods component <name>
  # replicas: 1
  # strategy: {type: Recreate}
  # entrypoint: {}
  # env: {}
  # configFiles:
  #   files: {}
  # resources: {}
  # podAnnotations: {}

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1
  # unhealthyPodEvictionPolicy: AlwaysAllow

networkPolicy:
  enabled: false
  # policyTypes: [Ingress]
  # ingress: []                       # NetworkPolicy ingress rules, rendered with tpl
  # egress: []

# Pod and Deployment settings, passed through as written.
revisionHistoryLimit: 1
strategy: {}
podLabels: {}
# automountServiceAccountToken: false
# enableServiceLinks: false
# terminationGracePeriodSeconds: 30
lifecycle: {}
topologySpreadConstraints: []         # rendered with tpl
# Containers that run before the app container, rendered with tpl, so an image can be written as
#   image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
initContainers: []
extraVolumes: []                      # rendered with tpl
extraVolumeMounts: []                 # on the app container

# CronJobs (off by default: an empty list renders nothing). Each entry reuses the Deployment's image, service
# account, security contexts, secretEnv, env, configFiles / persistence mounts and scheduling constraints.
cronJobs: []
#  - name: nightly-report              # CronJob name: <fullname>-<name>, max 52 characters
#    schedule: "30 20 * * *"           # required; UTC unless timeZone is set
#    timeZone: ""                      # e.g. Asia/Kolkata (Kubernetes >= 1.27)
#    args: ["report", "--nightly"]     # command / args like entrypoint
#    command: []
#    image: ""                         # default: the app image and tag
#    env: {}                           # merged over .Values.env, entry wins
#    resources: {}                     # default: .Values.resources
#    podAnnotations: {}                # default: .Values.podAnnotations
#    concurrencyPolicy: Forbid         # Allow | Forbid | Replace
#    suspend: false
#    startingDeadlineSeconds: 300
#    successfulJobsHistoryLimit: 3
#    failedJobsHistoryLimit: 3
#    backoffLimit: 0
#    activeDeadlineSeconds: 1800
#    ttlSecondsAfterFinished: 86400
#    restartPolicy: Never              # Never | OnFailure
